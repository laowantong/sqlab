[project]
name = "sqlab"
dynamic = ["version"]
description = "SQL Adventure Builder: a command line tool for creating standalone SQL activities."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE*"]
authors = [{ name = "Aristide Grange" }]
keywords = ["education", "relational", "database", "sql", "games"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: IPython",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Education",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "cmd2>=2.4.3,<3.0.0",
    "ipykernel>=6.0",
    "jupysql>=0.10.12",
    "markdown2[all]>=2.5.3,<3.0.0",
    "nbconvert>=7.0",
    "nbformat>=5.9",
    "sqlalchemy>=2.0.27,<3.0.0",
    "sqlparse>=0.4.4,<0.5.0",
]

[project.optional-dependencies]
mysql = ["mysql-connector-python>=8.2.0,<9.0.0", "pymysql>=1.0"]
mariadb = ["mysql-connector-python>=8.2.0,<9.0.0", "pymysql>=1.0"]
postgresql = ["psycopg2-binary>=2.9.9,<3.0.0"]
graph = ["graphviz>=0.20,<0.21"]
all = ["sqlab[mysql,postgresql,graph]"]

[project.urls]
Repository = "https://github.com/laowantong/sqlab/"
Issues = "https://github.com/laowantong/sqlab/issues"

[project.scripts]
sqlab = "sqlab.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "sqlab/__init__.py"

[tool.hatch.build]
exclude = ["sqlab/secrets.py"]
